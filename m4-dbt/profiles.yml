olist:
  target: local                  # default for manual runs
  outputs:
    local:                       # manual run in WSL, from inside m4-dbt/
      type: duckdb
      path: ../m3-ingest-warehouse/warehouse/olist.duckdb
      schema: analytics          # dbt models go here, separate from raw_olist
      threads: 2
      settings:
        memory_limit: "1GB"      # DuckDB defaults to ~80% of RAM
        TimeZone: "UTC"          # same time zone for manual and Airflow runs
    airflow:                     # inside the Airflow container (M3 mounted at /opt/m3)
      type: duckdb
      path: /opt/m3/warehouse/olist.duckdb
      schema: analytics
      threads: 2
      settings:
        memory_limit: "1GB"
        TimeZone: "UTC"
