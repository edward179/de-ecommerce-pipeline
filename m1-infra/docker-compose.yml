services:
  postgres:
    image: postgres:18-alpine
    container_name: de-postgres
    env_file: .env
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../data:/data:ro
    mem_limit: 512m
    restart: "no"
    networks: [default, de-net]
volumes:
  pgdata:

networks:
  de-net:
    external: true
